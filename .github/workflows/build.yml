name: Build PSCloud payloads
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ps5/**', 'src/**', 'tools/**', 'tests/**', 'Makefile', 'README.md', 'VERSION', '.github/workflows/build.yml']
  pull_request:
permissions:
  contents: read
jobs:
  upload:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler
        run: sudo apt-get update && sudo apt-get install -y clang-18 lld-18
      - name: Install pinned PS5 SDK and TLS libraries
        run: |
          curl --fail --location --retry 3 https://github.com/ps5-payload-dev/pacbrew-repo/releases/download/v0.40.2/ps5-payload-dev.tar.gz -o "$RUNNER_TEMP/ps5-libs.tar.gz"
          echo "a85f65de418a8e6a898c6c3e3c870d50fff7618a200e4dd59ea9692af6ecec4d  $RUNNER_TEMP/ps5-libs.tar.gz" | sha256sum --check
          sudo tar -xzf "$RUNNER_TEMP/ps5-libs.tar.gz" -C /
          SDK="/opt/ps5-payload-sdk"
          test -f "$SDK/toolchain/prospero.mk"
          echo "PS5_PAYLOAD_SDK=$SDK" >> "$GITHUB_ENV"
      - name: Report firmware coverage of the pinned SDK (informational)
        run: |
          # The SDK kernel helpers only start on firmware listed in its switch; PSCloud accepts all of them.
          python3 - "$PS5_PAYLOAD_SDK" <<'EOF'
          import pathlib,sys
          blob=b''.join(p.read_bytes() for p in pathlib.Path(sys.argv[1]).rglob('*') if p.is_file() and p.suffix in ('.a','.o','.c'))
          for fw in (0x1000000,0x4510000,0x7000000,0x9600000,0x10010000,0x11400000,0x12700000,0x13000000,0x13600000):
              found=fw.to_bytes(4,'little') in blob or (b'0x%x'%fw) in blob
              print('%x.%02x' % (fw>>24,(fw>>16)&255), 'present' if found else 'NOT FOUND')
          EOF
      - name: List save-related SDK stub symbols (informational)
        run: |
          for f in $(find "$PS5_PAYLOAD_SDK" \( -iname '*SceFsInternalForVsh*' -o -iname '*SceSaveData*' -o -iname '*SceRegMgr*' \) -type f); do
            echo "== $f"
            grep -a -o -E '(sce|kernel_)[A-Za-z0-9_]{4,}' "$f" | sort -u | grep -i -E 'savedata|pfs|ppr|sealed|regmgr|mountsave|keystone' || true
          done
      - name: Get SQLite 3.46.1 (same version as the PS5 save database)
        run: |
          curl --fail --location --retry 3 https://www.sqlite.org/2024/sqlite-amalgamation-3460100.zip -o "$RUNNER_TEMP/sqlite.zip"
          unzip -q "$RUNNER_TEMP/sqlite.zip" -d "$RUNNER_TEMP"
          mkdir -p ps5/third_party && mv "$RUNNER_TEMP/sqlite-amalgamation-3460100" ps5/third_party/sqlite
      - name: Build direct uploader
        run: make -C ps5 upload recovery backup dashboard share createtest writetest memdump vmmap
      - name: Package uploader and trusted CA bundle
        run: |
          mkdir -p upload-package
          cp ps5/pscloud-upload.elf ps5/pscloud-upload.conf.example ps5/UPLOAD_TEST.md ps5/WEBDAV_SETUP.md upload-package/
          CA=$(find "$PS5_PAYLOAD_SDK" -name ca-bundle.crt -print -quit)
          test -n "$CA"
          cp "$CA" upload-package/pscloud-ca.pem
          mkdir -p recovery-package
          cp ps5/pscloud-download.elf ps5/pscloud-restore.elf ps5/pscloud-download.conf.example ps5/pscloud-restore.conf.example ps5/RESTORE_TEST.md recovery-package/
          mkdir -p backup-package
          cp ps5/pscloud-backup.elf ps5/pscloud-backup.conf.example ps5/BACKUP_TEST.md backup-package/
          mkdir -p dashboard-package
          cp ps5/pscloud-dashboard.elf ps5/DASHBOARD.md VERSION dashboard-package/
          cp "$CA" dashboard-package/pscloud-ca.pem
          mkdir -p share-package
          cp ps5/pscloud-share.elf ps5/pscloud-share-game.elf ps5/pscloud-share.conf.example ps5/SHARING.md VERSION share-package/
      - uses: actions/upload-artifact@v4
        with:
          name: pscloud-upload
          path: upload-package/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pscloud-recovery
          path: recovery-package/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pscloud-backup
          path: backup-package/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pscloud-dashboard
          path: dashboard-package/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pscloud-share
          path: share-package/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pscloud-create-test
          path: ps5/pscloud-create-test.elf
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pscloud-write-test
          path: ps5/pscloud-write-test.elf
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pscloud-memdump
          path: ps5/pscloud-memdump.elf
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pscloud-vmmap
          path: ps5/pscloud-vmmap.elf
          if-no-files-found: error
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential libcurl4-openssl-dev libssl-dev libsqlite3-dev python3 openssl
      - name: Run host tests
        run: |
          set -o pipefail
          # Failing tracebacks become annotations, readable without signing in to GitHub.
          make test 2>&1 | tee host-tests.log || { python3 tools/ci_annotate_failures.py host-tests.log; exit 1; }
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler
        run: sudo apt-get update && sudo apt-get install -y clang-18 lld-18 unzip
      - name: Install PS5 payload SDK v0.43
        run: |
          curl --fail --location --retry 3 https://github.com/ps5-payload-dev/sdk/releases/download/v0.43/ps5-payload-sdk.zip -o "$RUNNER_TEMP/sdk.zip"
          unzip -q "$RUNNER_TEMP/sdk.zip" -d "$RUNNER_TEMP/sdk"
          SDK_MAKE=$(find "$RUNNER_TEMP/sdk" -path '*/toolchain/prospero.mk' -print -quit)
          test -n "$SDK_MAKE"
          echo "PS5_PAYLOAD_SDK=${SDK_MAKE%/toolchain/prospero.mk}" >> "$GITHUB_ENV"
      - name: Build diagnostic and export ELFs
        run: make -C ps5
      - uses: actions/upload-artifact@v4
        with:
          name: pscloud-probe
          path: ps5/pscloud-probe.elf
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pscloud-export
          path: ps5/pscloud-export.elf
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pscloud-ps
          path: ps5/pscloud-ps.elf
          if-no-files-found: error
